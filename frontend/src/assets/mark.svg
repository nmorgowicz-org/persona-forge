<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Persona Forge Signal Crucible mark</title>
  <desc id="desc">An open four-segment crucible transforms multiple voice signals into one waveform.</desc>
