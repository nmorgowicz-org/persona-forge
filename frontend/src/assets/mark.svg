    <linearGradient id="ceramic" x1="22" y1="15" x2="108" y2="116" gradientUnits="userSpaceOnUse"><stop stop-color="#5D6A8D"/><stop offset=".34" stop-color="#181D2D"/><stop offset="1" stop-color="#080B14"/></linearGradient>
    <linearGradient id="signal" x1="10" y1="64" x2="118" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#47BFFF"/><stop offset=".47" stop-color="#9B6BFF"/><stop offset=".67" stop-color="#E853FF"/><stop offset="1" stop-color="#A9E7FF"/></linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(64 64) rotate(90) scale(18)"><stop stop-color="#E853FF" stop-opacity=".95"/><stop offset=".34" stop-color="#9B6BFF" stop-opacity=".58"/><stop offset="1" stop-color="#111629" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
