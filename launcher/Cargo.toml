[package]
name = "persona-forge-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Thin native bootstrap for Persona Forge release archives (docs/plans/20260829-no_more_docker_requirement.md Phase 7)"
publish = false

[[bin]]
name = "persona-forge-launcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
