# Phase 1 spike workflow (persona-forge desktop execution plan).
# Replaces the Phase 0 stub ON THE SPIKE BRANCH ONLY; deleted again in the
# Phase 1 results PR. Proves the four risky integrations with real runs.
name: Desktop Spike

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the macOS spike builds (0.1.0 / 0.1.1). Windows+Linux always build both N=0.1.0 and N+1=0.1.1."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-spike
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: "2.11.5"
  SPIKE_FEED_BASE: "https://github.com/nmorgowicz-org/persona-forge/releases/download/desktop-spike"
  SPIKE_FEED_BASE_BADSIG: "https://github.com/nmorgowicz-org/persona-forge/releases/download/desktop-spike-badsig"

jobs:
  # ── 1A macOS chain ─────────────────────────────────────────────────────────
  spike-macos-build:
    name: spike-macos-build (${{ inputs.version }})
    runs-on: self-hosted-macos
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tauri-cli
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked

      - name: Download Sparkle framework (plugin build dependency)
        run: |
          cd spike/desktop-shell
          curl -fsSL https://raw.githubusercontent.com/ahonn/tauri-plugin-sparkle-updater/refs/heads/master/scripts/download-sparkle.sh | bash -s -- .

      - name: Generate dummy resource (10 MB, never committed)
        run: |
          cd spike/desktop-shell && mkdir -p resources
          dd if=/dev/urandom of=resources/dummy.bin bs=1048576 count=10

      - name: Build unsigned .app
        run: |
          cd spike/desktop-shell
          cargo tauri build --no-sign --bundles app --target aarch64-apple-darwin \
            --config '{"version":"${{ inputs.version }}"}'

      - name: Strip linker signature (rcodesign 0.29 cannot re-sign CodeDirectory v20400)
        run: |
          cd spike/desktop-shell/target/aarch64-apple-darwin/release/bundle/macos
          # expected: the bundler leaves an ad-hoc linker signature; absence is fine too
          codesign --remove-signature "desktop-spike.app/Contents/MacOS/desktop-spike" 2>/dev/null \
            || echo "binary had no signature to remove (expected either way)"
          codesign --remove-signature "desktop-spike.app" 2>/dev/null \
            || echo "bundle had no signature to remove (expected either way)"

      - name: Zip .app (ditto keeps symlinks)
        run: |
          cd spike/desktop-shell/target/aarch64-apple-darwin/release/bundle/macos
          # --norsrc/--noextattr: no AppleDouble ._ entries — they break Linux
          # unzip -> sign -> notarize (AppleDouble junk invalidates signatures)
          ditto -c -k --norsrc --noextattr --keepParent "desktop-spike.app" "$GITHUB_WORKSPACE/desktop-spike-${{ inputs.version }}.app.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-macos-app-${{ inputs.version }}
          path: desktop-spike-${{ inputs.version }}.app.zip
          if-no-files-found: error

  spike-macos-sign-app:
    name: spike-macos-sign-app (${{ inputs.version }})
    needs: spike-macos-build
    runs-on: arc-persona-forge-desktop
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-macos-app-${{ inputs.version }}
          path: artifact

      - name: Install rcodesign
        run: |
          set -euo pipefail
          RCODESIGN_VERSION="0.29.0"
          RCODESIGN_ASSET="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --location --silent --show-error -o rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${RCODESIGN_ASSET}.tar.gz"
          tar -xzf rcodesign.tar.gz "${RCODESIGN_ASSET}/rcodesign"
          mv "${RCODESIGN_ASSET}/rcodesign" ./rcodesign && chmod +x rcodesign

      - name: Prepare App Store Connect API key
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect
          echo "$APPLE_PRIVATE_KEY" > /tmp/AuthKey.pem
          ./rcodesign encode-app-store-connect-api-key \
            -o ~/.appstoreconnect/key.json \
            "$APPLE_ISSUER_ID" "$APPLE_KEY_ID" /tmp/AuthKey.pem

      - name: Remove AppleDouble junk from extraction
        run: find artifact -name "._*" -delete

      - name: Sign, notarize, staple the .app
        env:
          MACOS_KEY_PEM: ${{ secrets.MACOS_KEY_PEM }}
          MACOS_CERT_PEM: ${{ secrets.MACOS_CERT_PEM }}
        run: |
          set -euo pipefail
          cd artifact && unzip -q desktop-spike-${{ inputs.version }}.app.zip
          echo "$MACOS_KEY_PEM" > key.pem
          echo "$MACOS_CERT_PEM" > cert.pem
          ../rcodesign sign \
            --pem-file key.pem --pem-file cert.pem \
            --for-notarization \
            --entitlements-xml-file ../spike/desktop-shell/entitlements.plist \
            "desktop-spike.app"
          ../rcodesign notary-submit \
            --api-key-file ~/.appstoreconnect/key.json \
            --wait --staple "desktop-spike.app"
          rm -f key.pem cert.pem
          # -y: store symlinks as links; following them breaks Sparkle.framework's
          # Versions/Current layout and its signature
          zip -q -r -y signed-app.zip "desktop-spike.app"

      - name: Remove key material
        if: always()
        run: rm -rf ~/.appstoreconnect /tmp/AuthKey.pem

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-macos-app-signed-${{ inputs.version }}
          path: artifact/signed-app.zip
          if-no-files-found: error

  spike-macos-dmg:
    name: spike-macos-dmg (${{ inputs.version }})
    needs: spike-macos-sign-app
    runs-on: self-hosted-macos
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-macos-app-signed-${{ inputs.version }}
          path: artifact

      - name: Build DMG (signed .app + Applications symlink)
        run: |
          set -euo pipefail
          cd artifact && unzip -q signed-app.zip
          STAGING=$(mktemp -d)
          cp -R "desktop-spike.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "desktop-spike" -srcfolder "$STAGING" -ov -format UDZO \
            "desktop-spike-${{ inputs.version }}.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-macos-dmg-unsigned-${{ inputs.version }}
          path: artifact/desktop-spike-${{ inputs.version }}.dmg
          if-no-files-found: error

  spike-macos-sign-dmg:
    name: spike-macos-sign-dmg (${{ inputs.version }})
    needs: spike-macos-dmg
    runs-on: arc-persona-forge-desktop
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-macos-dmg-unsigned-${{ inputs.version }}
          path: artifact

      - name: Install rcodesign
        run: |
          set -euo pipefail
          RCODESIGN_VERSION="0.29.0"
          RCODESIGN_ASSET="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --location --silent --show-error -o rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${RCODESIGN_ASSET}.tar.gz"
          tar -xzf rcodesign.tar.gz "${RCODESIGN_ASSET}/rcodesign"
          mv "${RCODESIGN_ASSET}/rcodesign" ./rcodesign && chmod +x rcodesign

      - name: Prepare App Store Connect API key
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect
          echo "$APPLE_PRIVATE_KEY" > /tmp/AuthKey.pem
          ./rcodesign encode-app-store-connect-api-key \
            -o ~/.appstoreconnect/key.json \
            "$APPLE_ISSUER_ID" "$APPLE_KEY_ID" /tmp/AuthKey.pem

      - name: Sign, notarize, staple the DMG
        env:
          MACOS_KEY_PEM: ${{ secrets.MACOS_KEY_PEM }}
          MACOS_CERT_PEM: ${{ secrets.MACOS_CERT_PEM }}
        run: |
          set -euo pipefail
          cd artifact
          echo "$MACOS_KEY_PEM" > key.pem
          echo "$MACOS_CERT_PEM" > cert.pem
          ../rcodesign sign --pem-file key.pem --pem-file cert.pem \
            "desktop-spike-${{ inputs.version }}.dmg"
          ../rcodesign notary-submit \
            --api-key-file ~/.appstoreconnect/key.json \
            --wait --staple "desktop-spike-${{ inputs.version }}.dmg"
          rm -f key.pem cert.pem

      - name: Remove key material
        if: always()
        run: rm -rf ~/.appstoreconnect /tmp/AuthKey.pem

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-macos-dmg-signed-${{ inputs.version }}
          path: artifact/desktop-spike-${{ inputs.version }}.dmg
          if-no-files-found: error

  spike-macos-verify:
    name: spike-macos-verify (${{ inputs.version }})
    needs: spike-macos-sign-dmg
    runs-on: self-hosted-macos
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-macos-dmg-signed-${{ inputs.version }}
          path: dmg

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-macos-app-signed-${{ inputs.version }}
          path: appzip

      - name: Verify stapling + signatures (rcodesign #169: only stapler counts)
        run: |
          set -euo pipefail
          cd appzip && unzip -q signed-app.zip
          xcrun stapler validate "desktop-spike.app"
          codesign --verify --deep --strict --verbose=2 "desktop-spike.app"
          spctl --assess --type execute --verbose=4 "desktop-spike.app"
          cd ../dmg
          xcrun stapler validate "desktop-spike-${{ inputs.version }}.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 \
            "desktop-spike-${{ inputs.version }}.dmg"
          # nested code (Sparkle helpers/XPCs) must carry the app's own Team ID
          APP="$GITHUB_WORKSPACE/appzip/desktop-spike.app"
          team_of() { codesign -dv --verbose=4 "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p'; }
          APP_TEAM=$(team_of "$APP")
          [ -n "$APP_TEAM" ] && [ "$APP_TEAM" != "not set" ] || { echo "app has no TeamIdentifier"; exit 1; }
          echo "app TeamIdentifier=$APP_TEAM"
          COUNT=0
          while IFS= read -r f; do
            T=$(team_of "$f")
            echo "-- ${f#"$APP"/}: TeamIdentifier=$T"
            [ "$T" = "$APP_TEAM" ] || { echo "Team ID mismatch on $f"; exit 1; }
            COUNT=$((COUNT + 1))
          done < <(find "$APP/Contents/Frameworks" \( -type f -name Autoupdate \) -o \( -type d \( -name "*.xpc" -o -name "Updater.app" \) \))
          [ "$COUNT" -gt 0 ] || { echo "no nested Sparkle helpers found to inspect"; exit 1; }
          echo "$COUNT nested Sparkle helpers carry Team ID $APP_TEAM"

  spike-sparkle-sig:
    name: spike-sparkle-sig (${{ inputs.version }})
    needs: spike-macos-sign-dmg
    runs-on: arc-general
    timeout-minutes: 15
    outputs:
      signature: ${{ steps.sig.outputs.signature }}
      length: ${{ steps.sig.outputs.length }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-macos-dmg-signed-${{ inputs.version }}
          path: artifact

      - name: Sign with Sparkle EdDSA (OpenSSL 3 -rawin recipe, contract §9.2)
        id: sig
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          OPENSSL: openssl
        run: |
          set -euo pipefail
          DMG="artifact/desktop-spike-${{ inputs.version }}.dmg"
          LENGTH=$(stat -c%s "$DMG")
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | base64 -d > /tmp/seed.bin
          python3 spike/desktop-shell/scripts/seed_to_pem.py /tmp/seed.bin /tmp/ed25519.pem
          chmod 600 /tmp/ed25519.pem
          SIG=$($OPENSSL pkeyutl -sign -inkey /tmp/ed25519.pem -rawin -in "$DMG" | base64 -w0)
          rm -f /tmp/ed25519.pem /tmp/seed.bin
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"

  # ── 1B Windows ──────────────────────────────────────────────────────────────
  spike-windows-build:
    name: spike-windows-build (${{ matrix.version }})
    runs-on: self-hosted-windows
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ["0.1.0", "0.1.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Rust toolchain + tauri-cli (job-local, cached in runner _tool)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $root = Join-Path $env:RUNNER_TOOL_CACHE "desktop-rust"
          $env:RUSTUP_HOME = Join-Path $root "rustup"
          $env:CARGO_HOME = Join-Path $root "cargo"
          $env:PATH = "$env:CARGO_HOME\bin;$env:PATH"
          if (-not (Test-Path "$env:CARGO_HOME\bin\cargo.exe")) {
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "$env:TEMP\rustup-init.exe"
            & "$env:TEMP\rustup-init.exe" -y --default-toolchain 1.98-x86_64-pc-windows-msvc --profile minimal --no-modify-path
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed ($LASTEXITCODE)" }
          }
          # Always ensure the toolchain: a previous interrupted run (e.g. network
          # blocked mid-download) can leave the cargo.exe shim without a toolchain.
          $tc = "1.98-x86_64-pc-windows-msvc"
          & "$env:CARGO_HOME\bin\rustup.exe" toolchain install $tc --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install $tc failed ($LASTEXITCODE)" }
          & "$env:CARGO_HOME\bin\rustup.exe" default $tc
          if ($LASTEXITCODE -ne 0) { throw "rustup default $tc failed" }
          & "$env:CARGO_HOME\bin\cargo.exe" --version
          if (-not (Test-Path "$env:CARGO_HOME\bin\cargo-tauri.exe")) {
            & "$env:CARGO_HOME\bin\cargo.exe" install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo install tauri-cli failed ($LASTEXITCODE)" }
          }
          & "$env:CARGO_HOME\bin\cargo.exe" tauri --version
          "RUSTUP_HOME=$env:RUSTUP_HOME" | Add-Content $env:GITHUB_ENV
          "CARGO_HOME=$env:CARGO_HOME" | Add-Content $env:GITHUB_ENV
          Add-Content $env:GITHUB_PATH "$env:CARGO_HOME\bin"

      - name: Generate dummy resource
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path spike/desktop-shell/resources | Out-Null
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $buf = New-Object byte[] (10MB)
          $rng.GetBytes($buf)
          [System.IO.File]::WriteAllBytes("$PWD/spike/desktop-shell/resources/dummy.bin", $buf)

      - name: Build NSIS installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location spike/desktop-shell
          cargo tauri build --bundles nsis --target x86_64-pc-windows-msvc --config '{\"version\":\"${{ matrix.version }}\",\"bundle\":{\"createUpdaterArtifacts\":false}}'

      - name: Rename installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "spike/desktop-shell/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $setup = Get-ChildItem $dir -Filter "desktop-spike_*_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no NSIS setup exe found in $dir" }
          Move-Item $setup.FullName "$env:GITHUB_WORKSPACE\desktop-spike-${{ matrix.version }}-setup.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-windows-setup-${{ matrix.version }}
          path: desktop-spike-${{ matrix.version }}-setup.exe
          if-no-files-found: error

  # ── 1C Linux ────────────────────────────────────────────────────────────────
  spike-linux-build:
    name: spike-linux-build (${{ matrix.version }} / ${{ matrix.feed }})
    runs-on: arc-persona-forge-desktop
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "0.1.0"
            feed: good
          - version: "0.1.0"
            feed: badsig
          - version: "0.1.1"
            feed: good
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate dummy resource
        run: |
          cd spike/desktop-shell && mkdir -p resources
          dd if=/dev/urandom of=resources/dummy.bin bs=1048576 count=10

      - name: Build AppImage
        env:
          SPIKE_FEED_BASE: ${{ matrix.feed == 'good' && env.SPIKE_FEED_BASE || env.SPIKE_FEED_BASE_BADSIG }}
        run: |
          cd spike/desktop-shell
          # feed base is compiled in (option_env!)
          cargo tauri build --bundles appimage \
            --config '{"version":"${{ matrix.version }}","bundle":{"createUpdaterArtifacts":false,"linux":{"appimage":{"bundleMediaFramework":true}}}}'
          BIN=target/release/desktop-spike
          MAX_GLIBC=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "max glibc symbol: $MAX_GLIBC"
          # fail closed: must be <= GLIBC_2.35 (contract D8: oldest supported distro)
          [ "$(printf '%s\nGLIBC_2.35\n' "$MAX_GLIBC" | sort -V | head -1)" = "$MAX_GLIBC" ]

      - name: Rename AppImage
        run: |
          cd spike/desktop-shell/target/release/bundle/appimage
          # bundler names it with version+arch suffix (see log: desktop-spike_0.1.1_amd64.AppImage)
          mv "desktop-spike_${{ matrix.version }}_amd64.AppImage" "$GITHUB_WORKSPACE/desktop-spike-${{ matrix.version }}-${{ matrix.feed }}.AppImage"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-linux-appimage-${{ matrix.version }}-${{ matrix.feed }}
          path: desktop-spike-${{ matrix.version }}-${{ matrix.feed }}.AppImage
          if-no-files-found: error

  spike-updater-sigs:
    name: spike-updater-sigs
    needs: [spike-windows-build, spike-linux-build]
    runs-on: arc-persona-forge-desktop
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: spike-*0.1.1*

      - name: Sign with Tauri minisign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APPIMAGE=$(find artifacts -name '*0.1.1-good.AppImage' | head -1)
          SETUP=$(find artifacts -name '*0.1.1-setup.exe' | head -1)
          # the CLI binds TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) from env; passing
          # -f/-p as well conflicts, and env keeps the secrets off argv
          cargo tauri signer sign "$APPIMAGE"
          cargo tauri signer sign "$SETUP"
          find artifacts -name '*.sig' -type f

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-updater-sigs
          path: artifacts/**/*.sig
          if-no-files-found: error

  # ── 1C task 3: publish both test feeds (one latest.json, Windows + Linux) ────
  spike-linux-publish:
    name: spike-linux-publish
    needs: spike-updater-sigs
    runs-on: arc-general
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download N+1 AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-linux-appimage-0.1.1-good
          path: artifacts

      - name: Download N+1 setup exe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-windows-setup-0.1.1
          path: artifacts

      - name: Download updater signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-updater-sigs
          path: artifacts

      - name: Publish good and badsig feeds
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo "::error::gh CLI is not on this runner image"; exit 1; }
          pick() { find artifacts -type f -name "$1" | head -1; }
          APPIMAGE=$(pick 'desktop-spike-0.1.1-good.AppImage')
          SETUP=$(pick 'desktop-spike-0.1.1-setup.exe')
          APPIMAGE_SIG=$(pick 'desktop-spike-0.1.1-good.AppImage.sig')
          SETUP_SIG=$(pick 'desktop-spike-0.1.1-setup.exe.sig')
          for f in "$APPIMAGE" "$SETUP" "$APPIMAGE_SIG" "$SETUP_SIG"; do
            [ -n "$f" ] && [ -s "$f" ] || { echo "::error::missing or empty input: '$f'"; exit 1; }
          done
          A=desktop-spike_0.1.1_amd64.AppImage
          S=desktop-spike_0.1.1_x64-setup.exe
          mkdir -p good badsig
          cp "$APPIMAGE" "good/$A"; cp "$APPIMAGE_SIG" "good/$A.sig"
          cp "$SETUP" "good/$S";    cp "$SETUP_SIG" "good/$S.sig"
          BASE="https://github.com/$GH_REPO/releases/download"
          python3 spike/desktop-shell/scripts/make_latest_json.py --version 0.1.1 --out good/latest.json \
            --platform linux-x86_64-appimage "$BASE/desktop-spike/$A" "good/$A.sig" \
            --platform windows-x86_64-nsis "$BASE/desktop-spike/$S" "good/$S.sig"
          gh release upload desktop-spike good/* --clobber

          # badsig: N+1 AppImage with one byte flipped, served with the ORIGINAL signature
          cp "good/$A" "badsig/$A"
          python3 -c "import sys; p = sys.argv[1]; b = bytearray(open(p, 'rb').read()); b[len(b) // 2] ^= 0xFF; open(p, 'wb').write(b)" "badsig/$A"
          if cmp -s "good/$A" "badsig/$A"; then echo "::error::byte flip had no effect"; exit 1; fi
          python3 spike/desktop-shell/scripts/make_latest_json.py --version 0.1.1 --out badsig/latest.json \
            --platform linux-x86_64-appimage "$BASE/desktop-spike-badsig/$A" "good/$A.sig"
          gh release upload desktop-spike-badsig "badsig/$A" badsig/latest.json --clobber

  # ── 1C task 4: automated update (good) and signature rejection (badsig) ─────
  spike-linux-update:
    name: spike-linux-update (${{ matrix.mode }})
    needs: spike-linux-publish
    runs-on: arc-persona-forge-desktop
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [good, badsig]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-linux-appimage-0.1.0-${{ matrix.mode }}
          path: app

      - name: Run --ci-update and assert (${{ matrix.mode }})
        run: |
          set -euo pipefail
          APP="$PWD/app/desktop-spike-0.1.0-${{ matrix.mode }}.AppImage"
          chmod +x "$APP"
          "$APP" --version
          # the updater needs an app context (and so a display); outcome is judged from out.json
          set +e
          dbus-run-session -- xvfb-run -a "$APP" --ci-update "$RUNNER_TEMP/out.json"
          echo "ci-update exit=$?"
          set -e
          python3 spike/desktop-shell/scripts/assert_ci_update.py "$RUNNER_TEMP/out.json" "${{ matrix.mode }}" "$APP"

  # ── 1C task 5: WebDriver GUI checks against the test page ───────────────────
  spike-linux-gui:
    name: spike-linux-gui
    needs: spike-linux-build
    runs-on: arc-persona-forge-desktop
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-linux-appimage-0.1.0-good
          path: app

      - name: Serve the test page with synthesized tones
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE" && cp spike/desktop-shell/testpage/index.html "$SITE/"
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=2" "$SITE/tone.wav"
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=2" -codec:a libmp3lame "$SITE/tone.mp3"
          nohup python3 -m http.server 8318 --bind 127.0.0.1 --directory "$SITE" > "$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8318/tone.mp3 && break; sleep 0.5; done
          curl -fsS -o /dev/null http://127.0.0.1:8318/

      - name: Drive the AppImage through tauri-driver
        run: |
          set -euo pipefail
          APP="$PWD/app/desktop-spike-0.1.0-good.AppImage"
          chmod +x "$APP"
          dbus-run-session -- xvfb-run -a \
            spike/desktop-shell/scripts/run_gui_check.sh "$APP" "$RUNNER_TEMP/app-stderr.log"

      - name: App and driver log
        if: always()
        run: cat "$RUNNER_TEMP/app-stderr.log" || true

  # ── 1C task 6: newest distro (Ubuntu 26.04, no FUSE in pods) ────────────────
  spike-linux-newest:
    name: spike-linux-newest (Ubuntu 26.04)
    needs: spike-linux-build
    runs-on: arc-llama-monitor
    timeout-minutes: 15
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-linux-appimage-0.1.0-good
          path: app

      - name: Run N good --version
        run: |
          set -euo pipefail
          grep PRETTY_NAME /etc/os-release
          ldd --version | sed -n 1p
          APP="$PWD/app/desktop-spike-0.1.0-good.AppImage"
          chmod +x "$APP"
          V=$("$APP" --version)
          echo "$V"
          [ "$V" = "desktop-spike 0.1.0" ]
