name: Renovate configuration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-renovate:
    # Keep checked-out fork code off persistent runners, even if another caller is added.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release '))
    runs-on: arc-general
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Renovate 44.171.4 requires ^24.11.0; the app/build toolchain is independently Node 26.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # A self-hosted setup can return without a complete Node installation. Fail at the
      # toolchain boundary, not later as a misleading Renovate configuration failure.
      - name: Verify Node toolchain (including npx)
        run: |
          command -v node npm npx
          node --version
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 11) {
              console.error("Expected Node ^24.11.0, got " + process.version);
              process.exit(1);
            }
          '
          npm --version
          npx --version

      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.186.7 renovate-config-validator renovate.json
