name: Container Images

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    paths:
      - .github/workflows/image.yml
      - Dockerfile
      - app_api.py
      - app_worker.py
      - requirements*.txt
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - .github/workflows/image.yml
      - Dockerfile
      - app_api.py
      - app_worker.py
      - requirements*.txt
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nmorgowicz-org/qwen3-tts-openvino

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ready-to-test') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ready-to-test')
      )
    runs-on: arc-general-docker
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, exporter]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Calculate image tags
        id: tags
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo 'value<<EOF'
            echo "${image}:${{ matrix.target }}-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${image}:${{ matrix.target }}-latest"
            fi
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "${image}:${{ matrix.target }}-${GITHUB_REF_NAME}"
            fi
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Build and optionally publish ${{ matrix.target }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.target }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.target }},mode=min,ignore-error=true
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Pull published image for smoke test
        if: github.event_name != 'pull_request'
        run: docker pull "${REGISTRY}/${IMAGE_NAME}:${{ matrix.target }}-${GITHUB_SHA}"

      - name: Smoke-test image imports
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${{ matrix.target }}-${GITHUB_SHA}"
          if [[ "${{ matrix.target }}" == "exporter" ]]; then
            docker run --rm --entrypoint python "${image}" -c \
              'import nncf, openvino, optimum.intel, qwen_tts, torch; print("exporter imports passed")'
          else
            docker run --rm --entrypoint python "${image}" -c \
              'import openvino, qwen_tts, torch; print("runtime imports passed")'
          fi

  cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: arc-general
    permissions:
      packages: write
    steps:
      - name: Keep recent GHCR versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: qwen3-tts-openvino
          package-type: container
          min-versions-to-keep: 20
