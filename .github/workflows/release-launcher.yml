# Release workflow: build and validate the wheel, Linux CLI archive, and signed desktop apps.
# The macOS and Windows CLI archives stop with the first release containing desktop assets (D22).
# Desktop code signing, updater signing, and feed generation use ephemeral ARC runners only (D19).
# Every release asset and both signed update feeds are checksum-covered and fail-closed validated.
name: Release Launcher

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach artifacts to (e.g. persona-forge-v1.3.0)"
        required: true
        type: string
      dry_run:
        description: "Run the full pipeline but never publish a GitHub Release"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-launcher-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.9"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  RUST_VERSION: "1.98"

jobs:
  build-wheel:
    name: build-wheel
    runs-on: arc-general
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # uv build invokes Hatch's standard wheel hook, which runs the frontend's npm ci/check/build
      # steps to bake the Studio UI into the wheel.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv (pinned)
        run: python -m pip install uv==${{ env.UV_VERSION }}

      - name: uv lock --check
        run: uv lock --check

      - name: Build wheel + sdist
        run: uv build

      - name: Inspect release artifacts (fail-closed)
        run: uv run --frozen python scripts/inspect_release_artifacts.py --dist-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-and-sdist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  version:
    name: version
    runs-on: arc-general
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read project version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    name: desktop
    needs: [build-wheel, version]
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: true
      wheel_artifact: wheel-and-sdist
    secrets: inherit

  publish-feeds:
    name: publish-feeds
    needs: [version, desktop]
    runs-on: arc-persona-forge-desktop
    timeout-minutes: 15
    env:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-macos-aarch64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-windows-x86_64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-linux-x86_64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-updater-signatures
          path: signatures
      - name: Generate signed update feeds
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          find signatures -type f -name '*.sig' -exec mv {} release/ \;
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/generate_update_feeds.py \
            --release-dir release \
            --version "$RELEASE_VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --release-notes-file "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-update-feeds
          path: |
            release/appcast.xml
            release/latest.json
          retention-days: 7
          if-no-files-found: error

  build-launcher:
    name: build-launcher-${{ matrix.target }}
    needs: build-wheel
    runs-on: arc-llama-monitor
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_stem: linux-x86_64
            uv_target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ env.RUST_VERSION }} with target ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal
          rustup target add --toolchain "${RUSTUP_TOOLCHAIN}" "${{ matrix.target }}"

      - name: Preflight release toolchain
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: bash scripts/launcher_preflight.sh "${{ matrix.target }}" "${RUSTUP_TOOLCHAIN}"

      - name: Build launcher (${{ matrix.target }})
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: bash scripts/build_launcher_target.sh ${{ matrix.target }}

      - name: Fetch + verify pinned uv binary (${{ matrix.uv_target }})
        run: bash scripts/fetch_uv_binary.sh ${{ env.UV_VERSION }} ${{ matrix.uv_target }} uv-bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel-and-sdist
          path: dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv (pinned, for requirements export)
        run: python -m pip install uv==${{ env.UV_VERSION }}

      - name: Package launcher archive
        run: |
          set -euo pipefail
          UV_BIN="uv-bin/uv"
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          LAUNCHER_BIN="launcher/target/${{ matrix.target }}/release/persona-forge-launcher"
          VERSION=$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          uv run --frozen python scripts/package_launcher_archive.py \
            --target ${{ matrix.target }} \
            --version "$VERSION" \
            --launcher-binary "$LAUNCHER_BIN" \
            --uv-binary "$UV_BIN" \
            --uv-version ${{ env.UV_VERSION }} \
            --wheel "$WHEEL" \
            --out-dir release-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-${{ matrix.asset_stem }}
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

  smoke-launcher:
    name: smoke-launcher-linux
    needs: build-launcher
    runs-on: arc-general
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launcher-linux-x86_64
          path: release-assets

      - name: Smoke-test packaged Linux launcher doctor --json
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="release-assets/persona-forge-bootstrap-linux-x86_64.tar.gz"
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          tar -xzf "$ARCHIVE" -C "$SMOKE_DIR"
          LAUNCHER_BIN="$SMOKE_DIR/persona-forge-launcher"
          PERSONA_FORGE_HOME="$SMOKE_DIR/state" "$LAUNCHER_BIN" doctor --json

  release:
    name: release
    needs: [build-wheel, version, build-launcher, smoke-launcher, desktop, publish-feeds]
    runs-on: arc-general
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv (pinned)
        run: python -m pip install uv==${{ env.UV_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "wheel-and-sdist"
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "launcher-*"
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-macos-aarch64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-windows-x86_64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-linux-x86_64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-updater-signatures
          path: signatures
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-update-feeds
          path: release

      - name: Flatten updater signatures
        run: |
          set -euo pipefail
          find signatures -type f -name '*.sig' -exec mv {} release/ \;

      - name: Determine and verify release version
        id: version
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          VERSION="${TAG#persona-forge-v}"
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "release tag version $VERSION does not match project version $EXPECTED_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd release
          python3 - <<'PYEOF'
          import hashlib, json
          from pathlib import Path
          checksums = {}
          for f in sorted(Path(".").iterdir()):
              if f.is_file():
                  checksums[f.name] = hashlib.sha256(f.read_bytes()).hexdigest()
          Path("checksums.json").write_text(json.dumps({"checksums": checksums}, indent=2) + "\n")
          PYEOF
          cat checksums.json

      - name: Validate release contract (fail-closed)
        run: uv run --frozen python scripts/validate_release_contract.py --dir release --version ${{ steps.version.outputs.version }}

      - name: Update published release with artifacts
        if: github.event_name == 'release' && !inputs.dry_run
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ github.event.release.body }}
          files: release/*
          token: ${{ steps.app-token.outputs.token }}


      - name: Create manual release with generated notes
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          generate_release_notes: true
          files: release/*
          token: ${{ steps.app-token.outputs.token }}
