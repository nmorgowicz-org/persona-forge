name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release '))
    uses: ./.github/workflows/ci-renovate.yml

  validate:
    needs: renovate
    # A release-please merge to main is byte-identical to the PR head that already passed this job
    # (branch protection requires up-to-date branches), so don't repeat it on the push.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release '))
    runs-on: arc-general
    timeout-minutes: 15
    env:
      PYTHONPATH: src:src/export
    steps:
      # A failed dependency must fail this required check, not leave it skipped (green).
      - name: Require successful Renovate validation
        run: test '${{ needs.renovate.result }}' = 'success'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check whitespace
        run: git diff --check

      - name: Lint (ruff, correctness rules)
        run: ruff check .

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Run tests (pytest, fast, fake only)
        run: PYTHONPATH=src:src/export python -m pytest -m "not slow and not requires_torch and not requires_model_weights and not requires_openvino_ir" -n auto --tb=short tests/tier1_unit tests/tier2_backend tests/tier3_api_integration
