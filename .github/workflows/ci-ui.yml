name: UI E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Both jobs run `npm ci`: npm aborts a stalled read with `errno -110`
  # (`npm error network read ETIMEDOUT`) and defaults to 2 retries behind a 10 s/60 s backoff
  # plus a 300 s per-attempt timeout, so it gives up long before ARC egress recovers. A healthy
  # registry read never idles for 30 s (bytes flow continuously, and this timeout bounds
  # idleness, not transfer time), so failing fast and retrying wide turns a stall into a retry
  # instead of a failed job.
  NPM_CONFIG_FETCH_TIMEOUT: "30000"
  NPM_CONFIG_FETCH_RETRIES: "8"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "8000"

concurrency:
  group: ci-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths-filter:
    runs-on: arc-general
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      # Release PRs only bump version strings (incl. src/persona_forge/__init__.py), which would match the
      # `code` filter. `e2e` is a required check, so it still runs and fast-passes instead of being skipped.
      code: ${{ steps.filter.outputs.code == 'true' && !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - .github/workflows/ci-ui.yml
              - scripts/ci_node26_prerequisites.sh
              - "frontend/**"
              - "tests/ui/**"
              - "src/persona_forge/**"
              - requirements-dev.txt
            frontend:
              - .github/workflows/ci-ui.yml
              - scripts/ci_node26_prerequisites.sh
              - "frontend/**"
  frontend-lint:
    name: frontend-lint
    needs: paths-filter
    if: needs.paths-filter.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-general
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Ensure Node 26 Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci_node26_prerequisites.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Oxlint (warnings are errors)
        working-directory: frontend
        run: npm run lint

  e2e:
    name: e2e
    needs: paths-filter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-general
    timeout-minutes: 30
    env:
      PYTHONPATH: src:src/export
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: No relevant changes
        if: needs.paths-filter.outputs.code != 'true'
        run: echo "No frontend/UI-relevant changes detected (or release-please version-bump PR), skipping E2E run"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: needs.paths-filter.outputs.code == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Ensure Node 26 Linux runtime prerequisite
        if: runner.os == 'Linux' && needs.paths-filter.outputs.code == 'true'
        shell: bash
        run: bash scripts/ci_node26_prerequisites.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.paths-filter.outputs.code == 'true'
        with:
          node-version: "26"

      - name: Install Python test dependencies
        if: needs.paths-filter.outputs.code == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Environment and import smoke test
        if: needs.paths-filter.outputs.code == 'true'
        run: |
          echo "=== Environment ==="
          python --version
          pip list --format=columns | head -30
          echo "PYTHONPATH=$PYTHONPATH"
          echo "PWD=$(pwd)"

          echo "=== Import smoke test ==="
          python -c "
          import sys
          sys.path.insert(0, 'src')
          sys.path.insert(0, 'src/export')

          # Install fake model before importing app (no torch on runner)
          from tests.fixtures.fake_runtime import FakeModelRuntime
          rt = FakeModelRuntime()
          rt.install()

          errors = []
          def try_import(name):
              try:
                  __import__(name)
              except Exception as e:
                  errors.append(f'{name}: {e}')
          try_import('flask')
          try_import('soundfile')
          try_import('numpy')
          try_import('persona_forge')
          try_import('persona_forge.app')

          if errors:
              print('IMPORT ERRORS:')
              for e in errors:
                  print(' ', e)
              sys.exit(1)
          else:
              print('All critical imports OK')
          "

      - name: Install frontend dependencies
        if: needs.paths-filter.outputs.code == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: needs.paths-filter.outputs.code == 'true'
        working-directory: frontend
        run: npm run build

      - name: Install Playwright test dependencies
        if: needs.paths-filter.outputs.code == 'true'
        working-directory: tests/ui
        run: npm ci

      - name: Cache Playwright browsers
        if: needs.paths-filter.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/ui/package-lock.json') }}

      # A browsers-cache miss means one ~170 MB read from a single host (cdn.playwright.dev,
      # which redirects to the Chrome for Testing bucket). Playwright's own 5 attempts all died
      # `read ETIMEDOUT` ~13 s apart on PR #463, and this is a required check on shared ARC
      # runners whose egress stalls (see the same bounded loop around the BuildKit pre-pull in
      # image.yml). Fresh attempts after a backoff are what keep a stall from failing the job;
      # npm ci in this job gets the same tolerance through NPM_CONFIG_* above.
      - name: Install Playwright browsers with retries
        if: needs.paths-filter.outputs.code == 'true'
        shell: bash
        working-directory: tests/ui
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "Unable to install Playwright Chromium after 5 attempts" >&2
          exit 1

      - name: Start fake_model_server
        if: needs.paths-filter.outputs.code == 'true'
        run: |
          # Seed the same disposable libraries used by local E2E, then launch the
          # fake-only Python server. This avoids relying on child-process environment
          # propagation from the Node harness on the self-hosted runner.
          E2E_DATA_DIR="$(mktemp -d)"
          mkdir -p "$E2E_DATA_DIR/voices" "$E2E_DATA_DIR/segments"
          cp -R tests/ui/fixtures/capture-data/voices/. "$E2E_DATA_DIR/voices/"
          cp -R tests/ui/fixtures/capture-data/segments/. "$E2E_DATA_DIR/segments/"
          export VOICE_LIBRARY_DIR="$E2E_DATA_DIR/voices"
          export SEGMENT_LIBRARY_DIR="$E2E_DATA_DIR/segments"
          export FRONTEND_DIST_DIR="$PWD/frontend/dist"
          export PERSONA_FORGE_TEST_PORT=8319

          python tests/ui/fixtures/fake_model_server.py > fake_model_server.log 2>&1 &
          SERVER_PID=$!
          echo "fake_model_server PID=$SERVER_PID"

          echo "=== Waiting for fake_model_server to become healthy ==="
          deadline=$((SECONDS + 10))
          while [ $SECONDS -lt $deadline ]; do
            sleep 1
            set +e
            response=$(curl -s -w "\n%{http_code}" http://127.0.0.1:8319/health 2>&1 || true)
            code=$(echo "$response" | tail -1)
            set -e

            if [ "$code" = "200" ]; then
              echo "fake_model_server is healthy after $((SECONDS))s"
              echo "health response:"
              echo "$response"
              segment_count=$(curl -fsS http://127.0.0.1:8319/omnivoice/segments | python -c "import json,sys; print(len(json.load(sys.stdin).get('segments', [])))")
              echo "fake segment fixture count: $segment_count"
              test "$segment_count" -gt 0
              exit 0
            fi
          done

          echo "=== fake_model_server did not become healthy ==="
          echo "Server PID alive?"
          kill -0 "$SERVER_PID" 2>/dev/null && echo "YES" || echo "NO"
          echo "--- fake_model_server logs (full) ---"
          cat fake_model_server.log || echo "(empty or unreadable)"
          echo "--- end logs ---"
          exit 1

      - name: Run Playwright E2E tests
        if: needs.paths-filter.outputs.code == 'true'
        working-directory: tests/ui
        env:
          PYTHONPATH: src:src/export
          PERSONA_FORGE_UI_URL: http://127.0.0.1:8319
          # Shared-runner CPU contention produces 50-400 ms scheduler-noise long tasks; keep the
          # strict 50 ms budget locally and use a ceiling that still catches real blocking here.
          LONGTASK_THRESHOLD_MS: "600"
        run: npm run test:ci

      - name: Upload Playwright report
        if: failure() && needs.paths-filter.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/ui/playwright-report
          retention-days: 1

      - name: Upload Playwright test results
        if: failure() && needs.paths-filter.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: tests/ui/test-results
          if-no-files-found: warn
          retention-days: 1

      - name: Upload fake_model_server log
        if: failure() && needs.paths-filter.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fake_model_server-log
          path: fake_model_server.log
          retention-days: 1
