name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version for the bundle and manifest (e.g. 2.1.3)"
        required: true
        type: string
      sign:
        description: "Sign/notarize the macOS artifact (Phase 5+)"
        default: false
        type: boolean
      feed_base:
        description: "Update feed base URL override for test builds (Phase 6B)"
        default: ""
        type: string
      ci_hooks:
        description: "Build Windows/Linux with the ci-hooks feature (Phase 6B)"
        default: false
        type: boolean
      wheel_artifact:
        description: "Existing wheel artifact name to download instead of building"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  stub:
    name: stub
    runs-on: arc-general
    timeout-minutes: 5
    steps:
      - name: Stub — replaced in Phase 4
        run: |
          echo "stub: implemented in a later phase"
          exit 1
