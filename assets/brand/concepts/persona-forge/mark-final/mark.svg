<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Persona Forge mark, final (owner D7 = M-b "Ring + spark", CP0b 2026-09-23). Full-detail
       variant for >= 48 px (sidebar tile, startup state, README). Favicon sizes use
       mark-small.svg. Original geometry derived from the Option E hero; not the Vite bolt. -->
  <defs>
    <linearGradient id="pf-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
    <linearGradient id="pf-spark" x1="26" y1="12" x2="38" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4efff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <radialGradient id="pf-core" cx="32" cy="32" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a1f8f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#140d33" stop-opacity="0"/>
    </radialGradient>
    <filter id="pf-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="19.2" fill="#120b2e"/>
  <circle cx="32" cy="32" r="18" fill="url(#pf-core)"/>
  <circle cx="32" cy="32" r="22" stroke="url(#pf-ring)" stroke-width="6" stroke-dasharray="31.56 3" transform="rotate(-45 32 32)"/>
  <circle cx="32" cy="32" r="18.6" stroke="#ede6ff" stroke-opacity=".18" stroke-width=".75"/>
  <g transform="translate(32 32) scale(.72) translate(-32 -32)" filter="url(#pf-glow)">
    <path d="M36 12 21 35h9l-4 17 17-25h-9l5-15z" fill="url(#pf-spark)" stroke="#4c1d95" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
