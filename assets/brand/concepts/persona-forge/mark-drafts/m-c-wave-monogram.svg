<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- M-c "Waveform monogram" draft (B-P0, luminous instrument plan). A "P" whose bowl carries
       a luminous waveform: built for the smallest sizes (favicon, 16 px) where a ring blurs. -->
  <defs>
    <linearGradient id="mc-stroke" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
    <filter id="mc-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M19 54V13h15a12.5 12.5 0 0 1 0 25H19" stroke="url(#mc-stroke)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 25.5h2l2-4 2.5 9 2.5-12 2.5 13 2.5-8.5 2 4.5h2" stroke="#ede6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#mc-glow)"/>
</svg>
