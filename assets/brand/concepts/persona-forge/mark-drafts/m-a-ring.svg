<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- M-a "Ring" draft (B-P0, luminous instrument plan). Option E's segmented forge ring with a
       luminous waveform crossing its center line. Original geometry; no bolt. -->
  <defs>
    <linearGradient id="ma-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
    <filter id="ma-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="22" stroke="url(#ma-ring)" stroke-width="6" stroke-dasharray="31.56 3" transform="rotate(-45 32 32)"/>
  <circle cx="32" cy="32" r="15.5" stroke="#ede6ff" stroke-opacity=".22" stroke-width="1"/>
  <path d="M4 32H13l3-3 3 7 3-12 3 17 3-23 3 28 3-26 3 21 3-15 3 11 3-8 3 5 3-3H60" stroke="#ede6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ma-glow)"/>
</svg>
